name: Windows general and UAC editions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify no Deskflow installation
        run: |
          if (Test-Path 'C:\Program Files\Deskflow') { throw 'Runner must not have Deskflow installed' }
      - name: Set up Windows C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Test Korean key press and release policy
        shell: pwsh
        run: |
          cl /nologo /EHsc /std:c++17 /W4 /WX tests/windows_hangul_tap.cpp "/Fe:$env:RUNNER_TEMP/hangul-tap-test.exe" "/Fo:$env:RUNNER_TEMP/hangul-tap-test.obj"
          if ($LASTEXITCODE -ne 0) { throw 'Korean key test compilation failed' }
          & "$env:RUNNER_TEMP/hangul-tap-test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Korean key test failed' }
      - name: Qt input-engine SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: win64_msvc2022_64
          cache: true
          # aqt 3.3.0 predates the Qt 6.11 repository split. Pin the merged
          # upstream support commit instead of a mutable branch or PR ref.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
      - name: Restore application Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install input-engine OpenSSL development files
        shell: pwsh
        run: |
          $installed = Join-Path $env:ProgramFiles 'OpenSSL'
          if ((Test-Path "$installed/include/openssl/ssl.h") -and (Test-Path "$installed/lib/VC/x64/MD/libssl.lib") -and (Test-Path "$installed/lib/VC/x64/MD/libcrypto.lib")) {
            "OPENSSL_ROOT_DIR=$installed" >> $env:GITHUB_ENV
          } else {
            & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows --disable-metrics
            if ($LASTEXITCODE -ne 0) { throw 'OpenSSL development package failed' }
            "OPENSSL_ROOT_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          }
          'QT_PLUGIN_PATH=' >> $env:GITHUB_ENV
          'QT_QPA_PLATFORM_PLUGIN_PATH=' >> $env:GITHUB_ENV
      - name: Prepare built-in input engine
        run: python tools/prepare_input_bundle.py
      - name: Native Windows tests
        run: python -m pytest -q
      - name: Build app
        run: python tools/build_exe.py
      - name: Test packaged app
        run: python tools/exe_smoke.py
      - name: Test packaged built-in input
        run: python tools/bundled_input_smoke.py
      - name: Build UAC service installer
        run: python tools/build_windows_uac.py
      - name: Test installed UAC service
        run: python tools/windows_uac_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-win-x64
          path: |
            dist/v1.6.6/ClipBridge.exe
            dist/v1.6.6/ClipBridge-UAC-setup-x64.msi
          if-no-files-found: error
