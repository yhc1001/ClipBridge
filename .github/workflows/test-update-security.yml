name: Update security on disposable Windows runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-security:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test dependencies
        run: python -m pip install "cryptography>=50,<51" "pywin32>=308" "pytest>=8,<10"
      - name: Signed update and restricted key access tests
        run: python -m pytest -q tests/test_update_verify.py tests/test_update_transport.py
