name: macOS apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare built-in input engine
        run: python tools/prepare_input_bundle.py
      - name: Native macOS tests
        run: python -m pytest -q --basetemp "${RUNNER_TEMP}/clipbridge-tests"
      - name: Build app
        run: python tools/build_macos.py
      - name: Test packaged app
        run: python tools/macos_app_smoke.py
      - name: Test packaged built-in input
        run: python tools/bundled_input_smoke.py
      - name: Save app and test metadata
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-macOS-${{ matrix.architecture }}
          path: dist/ClipBridge-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error
