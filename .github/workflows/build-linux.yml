name: Linux app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Desktop test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xclip libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Native input build dependencies
        run: sudo apt-get install -y cmake ninja-build g++ libssl-dev libx11-dev libxtst-dev libxrandr-dev libxinerama-dev libxi-dev libxkbfile-dev libxkbcommon-dev libxkbregistry-dev libsm-dev libice-dev xdotool
      - name: Qt input-engine SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          cache: true
      - name: Prepare built-in input engine
        run: python tools/prepare_input_bundle.py
      - name: Qt desktop startup
        run: xvfb-run -a python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); print('X11 desktop initialized')"
      - name: Native Linux tests
        run: xvfb-run -a python -m pytest -q -s --basetemp "${RUNNER_TEMP}/clipbridge-tests"
      - name: Build app
        run: python tools/build_linux.py
      - name: Test packaged app
        run: xvfb-run -a python tools/linux_app_smoke.py
      - name: Test packaged built-in input
        run: xvfb-run -a python tools/bundled_input_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-linux-x86_64
          path: dist/ClipBridge-linux-x86_64.tar.gz
          if-no-files-found: error
